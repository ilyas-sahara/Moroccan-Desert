<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saharavacation</title>
    <script>
      (function () {
        var pathname = window.location.pathname;
        var rest = pathname.replace(/^\//, '');
        sessionStorage.setItem('spa-redirect', rest || '/');
        window.location.replace('/');
      })();
    </script>
  </head>
  <body></body>
</html>
